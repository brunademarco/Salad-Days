<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../assets/css/global/global.css" />
  <link rel="stylesheet" href="../../assets/css/global/cursor.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="../../assets/css/global/responsive.css" />
  <link rel="icon" href="../../assets/images/logo-icon.svg" type="image/x-icon" />
  <title>Detalhes da Receita - Salad Days</title>
</head>
<body>
  <header>
    <nav class="nav-bar">
      <a href="../../index.html" class="logo-link">
        <div class="logo">
          <img class="logo-svg" src="../../assets/images/LOGO.svg" alt="logo salad days" />
        </div>
      </a>
      <ul class="menu">
        <li>
          <a href="#" class="button-icon" id="openFavoritosBtn">
            <img class="heart-svg" src="../../assets/images/heart-straight-light.svg" alt="button favoritos" />
          </a>
        </li>
        <li>
          <a href="../../login.html" class="button-icon" id="login-redirect">
            <img class="person-svg" src="../../assets/images/user-light24x.svg" alt="button profile" />
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="recipe-detail" id="recipe-detail" aria-live="polite">
    <p class="detail-status">Carregando receita...</p>
  </main>

  <div class="modal" id="modal-favoritos">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="title-favorites">Favoritos</h2>
        <button class="close-button" id="closeFavoritosModal" type="button">
          <img src="../../assets/images/close2.svg" alt="Fechar favoritos" />
        </button>
      </div>
      <div class="modal-body">
        <div class="search-bar">
          <input type="text" placeholder="Pesquisar receitas..." />
          <button type="button" aria-label="Buscar">
            <img src="../../assets/images/search.svg" alt="" />
          </button>
        </div>
        <div class="column-recipes"></div>
      </div>
    </div>
  </div>

  <footer>
    <h4>&copy; 2025 Salad Days. Todos os direitos reservados.</h4>
    <p>Feito com amor</p>
    <p>Contato:</p>
    <div class="link-redes">
      <a href="https://github.com/brunanoely" target="_blank">
        <img class="github" src="../../assets/images/github.svg" alt="icon github" />
      </a>
      <a href="https://www.linkedin.com/in/bruna-noely-68a70925a/" target="_blank">
        <img class="linkedin" src="../../assets/images/linkedin.svg" alt="icon linkedin" />
      </a>
      <a href="https://www.instagram.com/brunanoelydm/" target="_blank">
        <img class="instagram" src="../../assets/images/behance.svg" alt="icon behance" />
      </a>
    </div>
  </footer>

  <script src="../../assets/js/common.js"></script>
  <script src="./receita.js"></script>
</body>
</html>
