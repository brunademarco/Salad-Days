<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--referencias --> 
    <link rel="stylesheet" href="../../assets/css/global/global.css">
    <link rel="stylesheet" href="../../assets/css/global/cursor.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../../assets/css/global/responsive.css">
    <link rel="icon" href="../../assets/images/logo-icon.svg" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!--fim das referencias-->
    <title>Perfil - Salad Days</title>
</head>
<body>
    <header>
        <nav class="nav-bar">
          <a href="../../index.html" class="logo-link">
            <div class="logo">
                <img class="logo-svg"  src="../../assets/images/LOGO.svg" alt="logo salad days">
            </div>
          </a>
            <ul class="menu">
                <li>
                    <a href="#" class="button-icon" id="openFavoritosBtn">
                        <img class="heart-svg" src="../../assets/images/heart-straight-light.svg" alt="button favoritos">
                    </a>
                </li>
                <li>
                    <a href="../../login.html" class="button-icon">
                        <img class="person-svg"  src="../../assets/images/user-light24x.svg" alt="button profile">
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="perfil-container">

    <aside class="perfil-sidebar">
      <button class="sidebar-button active" data-view="perfil">
        <img src="../../assets/images/editarPerfil.svg" alt="Perfil" />
        Perfil
      </button>
      <button class="sidebar-button" data-view="receitas">
        <img src="../../assets/images/receitasEnviadas.svg" alt="Receitas enviadas" />
        Receitas enviadas
      </button>
      <button class="sidebar-button" data-view="favoritos">
        <img src="../../assets/images/listaFavoritas.svg" alt="Favoritos" />
        Favoritos
      </button>
    </aside>


  <section id="perfil-content" class="perfil-content"></section>
  </main>

  <div id="confirm-modal" class="confirm-hidden">
  <div class="confirm-box">
    <p id="confirm-message">Tem certeza?</p>
    <div class="confirm-buttons">
        <button id="confirm-no">Cancelar</button>
      <button id="confirm-yes">Sim</button>
    </div>
  </div>
</div>

<div id="modal-edicao" class="modal-edicao oculto">
  <div class="modal-conteudo">
    <h3 id="modal-titulo">Editar</h3>

    <div id="grupo-input-unico">
      <input type="text" id="modal-input" />
    </div>

    <div id="grupo-input-senha" class="oculto">
      <input type="password" id="senha-atual" placeholder="Senha atual" />
      <input type="password" id="nova-senha" placeholder="Nova senha" />
      <input type="password" id="confirmar-senha" placeholder="Confirmar nova senha" />
    </div>

    <div class="modal-botoes">
      <button id="cancelar-edicao">Cancelar</button>
      <button id="salvar-edicao">Salvar</button>
    </div>
  </div>
</div>

<div id="modal-edicao-receita" class="modal-edicao oculto">
  <form id="form-edicao-receita" class="modal-conteudo modal-receita-conteudo">
    <h3>Editar receita</h3>
    <div class="receita-form-grid">
      <label>Título<input name="titulo" required maxlength="160"></label>
      <label>Descrição<textarea name="descricao" required></textarea></label>
      <label>Tempo de preparo (min)<input name="tempo_preparo_min" type="number" min="1" required></label>
      <label>Porções<input name="numero_porcoes" type="number" min="1" required></label>
      <label>Imagem (URL)<input name="imagem" type="url" required></label>
      <label>Categorias<input name="categoria_id" placeholder="IDs separados por vírgula"></label>
      <label>Ingredientes da base<textarea name="ingredientes_base"></textarea></label>
      <label>Ingredientes do molho<textarea name="ingredientes_molho"></textarea></label>
      <label class="receita-form-wide">Modo de preparo<textarea name="instrucoes" required></textarea></label>
    </div>
    <div class="modal-botoes">
      <button type="button" id="cancelar-edicao-receita">Cancelar</button>
      <button type="submit">Salvar alterações</button>
    </div>
  </form>
</div>

<div id="modal-nova-receita" class="modal-edicao oculto">
  <form id="form-nova-receita" class="modal-conteudo modal-receita-conteudo">
    <h3>FORMULÁRIO</h3>
    <div class="receita-form-grid">
      <label>Título<input name="titulo" required maxlength="160"></label>
      <label>Descrição<textarea name="descricao" required></textarea></label>
      <label>Tempo de preparo (min)<input name="tempo" type="number" min="1" required></label>
      <label>Porções<input name="porcoes" type="number" min="1" required></label>
      <label>Categorias
        <div class="categoria-picker perfil-categoria-picker">
          <select id="categoria-nova-receita">
            <option value="" disabled selected>Selecione uma categoria</option>
          </select>
          <button type="button" id="adicionar-categoria-nova">Adicionar</button>
        </div>
        <div id="categorias-nova-selecionadas" class="categoria-selecionadas"></div>
      </label>
      <label>Imagem<input name="imagem" type="file" accept="image/jpeg,image/png,image/webp" required></label>
      <label>Ingredientes da base<textarea name="base" required></textarea></label>
      <label>Ingredientes do molho<textarea name="molho" required></textarea></label>
      <label class="receita-form-wide">Modo de preparo<textarea name="preparo" required></textarea></label>
    </div>
    <div class="modal-botoes">
      <button type="button" id="cancelar-nova-receita">Cancelar</button>
      <button type="submit">ENVIAR</button>
    </div>
  </form>
</div>

</body>
<script src="../../assets/js/common.js"></script>
<script src="./usuario.js"></script>
</html>
